name: Offline verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests
      - run: python skills/lg-fwy916wbtn1/scripts/manage.py prepare --workspace "$RUNNER_TEMP/fwy916wbtn1"
      - run: python skills/lg-fwy916wbtn1/scripts/manage.py verify --workspace "$RUNNER_TEMP/fwy916wbtn1"
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update
      - run: sudo apt-get install --no-install-recommends -y python3-pyqt6 libqt6svg6
      - run: dbus-run-session -- /usr/bin/python3 desktop/smoke_test.py
